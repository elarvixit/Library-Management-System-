<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset=".55" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="arch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c7d2fe"/>
      <stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="shelf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b07a4a"/>
      <stop offset="1" stop-color="#7a4f2b"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="none" stroke="#fff" stroke-opacity=".18"/>
  <!-- arched library window -->
  <path d="M14 44 V27 a18 18 0 0 1 36 0 V44 Z" fill="url(#arch)" opacity=".95"/>
  <path d="M32 9.5 V44 M14 30 H50" stroke="#4338ca" stroke-width="2" opacity=".45"/>
  <!-- books on the shelf -->
  <rect x="17" y="27" width="6" height="17" rx="1" fill="#b91c1c"/>
  <rect x="23.5" y="23" width="6.5" height="21" rx="1" fill="#0f766e"/>
  <rect x="30.5" y="26" width="5" height="18" rx="1" fill="#1d4ed8"/>
  <rect x="36" y="21" width="6" height="23" rx="1" fill="#d97706"/>
  <rect x="42.5" y="29" width="5" height="15" rx="1" fill="#7c3aed" transform="rotate(10 45 44)"/>
  <!-- spine bands -->
  <g fill="#fef3c7" opacity=".8">
    <rect x="17" y="30" width="6" height="1.6"/><rect x="23.5" y="26.5" width="6.5" height="1.6"/>
    <rect x="30.5" y="29.5" width="5" height="1.6"/><rect x="36" y="24.5" width="6" height="1.6"/>
  </g>
  <!-- shelf -->
  <rect x="10" y="44" width="44" height="5" rx="1.5" fill="url(#shelf)"/>
  <rect x="10" y="49" width="44" height="1.5" fill="#000" opacity=".2"/>
  <!-- bookmark ribbon -->
  <path d="M44 9 h6 v10 l-3 -2.4 l-3 2.4 z" fill="#fbbf24"/>
</svg>
